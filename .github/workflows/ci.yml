name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore backend/AutoPartsERP.API/AutoPartsERP.API.csproj
      - name: Build
        run: dotnet build backend/AutoPartsERP.API/AutoPartsERP.API.csproj --no-restore -c Release
      - name: Test
        run: dotnet test backend/AutoPartsERP.Tests/AutoPartsERP.Tests.csproj -c Release
      - name: Build Docker image
        run: docker build -t autopartserp-api backend/AutoPartsERP.API

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build

  publish:
    needs: [backend, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend/AutoPartsERP.API
          push: true
          tags: ghcr.io/jamiruddindowlat1-coder/autopartserp-api:latest
