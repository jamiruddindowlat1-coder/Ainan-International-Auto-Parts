name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore backend/AutoPartsERP.API/AutoPartsERP.API.csproj
      - name: Build
        run: dotnet build backend/AutoPartsERP.API/AutoPartsERP.API.csproj --no-restore -c Release
      - name: Build Docker image
        run: docker build -t autopartserp-api backend/AutoPartsERP.API

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
