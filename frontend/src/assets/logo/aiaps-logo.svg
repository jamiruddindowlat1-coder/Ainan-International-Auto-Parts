<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A6B" />
      <stop offset="100%" stop-color="#2A52A0" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C85F10" />
      <stop offset="100%" stop-color="#E87722" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E87722" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- LOGO EMBLEM / ICON -->
  <g transform="translate(10, 10)">
    <!-- Gear outer -->
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#primaryGrad)" />
    
    <!-- Stylized AI Badge -->
    <path d="M 22 58 L 34 22 L 46 58 Z" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" />
    <line x1="26" y1="46" x2="42" y2="46" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" />
    
    <!-- Parts Spark Orbit -->
    <circle cx="58" cy="26" r="6" fill="url(#accentGrad)" filter="url(#glow)" />
    <path d="M 58 36 L 58 58" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <line x1="52" y1="58" x2="64" y2="58" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- BRAND TEXT -->
  <g transform="translate(105, 38)">
    <text x="0" y="0" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="28" fill="#1B3A6B" letter-spacing="1.5">
      AIAPS
    </text>
    <text x="96" y="0" font-family="'Outfit', 'Inter', sans-serif" font-weight="700" font-size="14" fill="#E87722" letter-spacing="1">
      ERP
    </text>
    <text x="0" y="22" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#2A52A0" letter-spacing="0.4">
      Ainan International Auto Parts System
    </text>
    <text x="0" y="38" font-family="'Inter', sans-serif" font-weight="400" font-size="10" fill="#64748B" letter-spacing="0.2">
      Your Trusted Auto Parts Partner Worldwide
    </text>
  </g>
</svg>
